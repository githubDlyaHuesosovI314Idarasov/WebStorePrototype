<div #carouselEL id="carouselAutoplaying" class="carousel slide" data-bs-ride="carousel" (mouseenter)="startCarousel()" (mousedown)="stopCarousel()">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img [src]="[productImages.at(0)?.url]" class="d-block w-100"/>  
    </div>

    @for(productImageUrl of productImages; track $index)
    {
      <div class="carousel-item">
        <img [src]="[productImageUrl]" class="d-block w-100"/>
      </div>
    }
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselAutoplaying" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselAutoplaying" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
