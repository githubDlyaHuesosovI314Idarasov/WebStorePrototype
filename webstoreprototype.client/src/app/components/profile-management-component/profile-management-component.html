<div class="container">
    <div class="card">
        <ul class="list-group mt-1">
            
            <li class="list-group-item d-flex border-0">
                <input class="btn-check" type="radio" name="vbtn-radio" id="vbtn-radio1" routerLink="edit" autocomplete="off" checked/>
                <label class="btn btn-outline-primary flex-grow-1 py-3" for="vbtn-radio1" ><fa-icon [icon]="faPenToSquare"/> Edit Profile</label> 
            </li>
            <li class="list-group-item d-flex border-0">
                <input class="btn-check" type="radio" name="vbtn-radio" id="vbtn-radio2" routerLink="orders" autocomplete="off" />
                <label class="btn btn-outline-primary flex-grow-1 py-3" for="vbtn-radio2" ><fa-icon [icon]="faList"/> My Orders</label> 
            </li>
            <li class="list-group-item d-flex border-0">                    
                <input class="btn-check" type="radio" name="vbtn-radio" routerLink="favorites" id="vbtn-radio3" autocomplete="off"/>
                <label class="btn btn-outline-primary flex-grow-1 py-3" for="vbtn-radio3"><fa-icon [icon]="faHeart"/> My Favorites</label> 
            </li>
            <li class="list-group-item d-flex border-0">
                <input class="btn-check" type="radio" name="vbtn-radio" routerLink="reviews" id="vbtn-radio4" autocomplete="off"/>
                <label class="btn btn-outline-primary flex-grow-1 py-3" for="vbtn-radio4"><fa-icon [icon]="faStar"/> Reviews</label> 
            </li>
            <li class="list-group-item d-flex border-0">
                <button class="btn btn-outline-danger flex-grow-1" (click)="logout()"><fa-icon [icon]="faRightFromBracket"></fa-icon> Logout</button>
            </li>
            
        </ul>
    </div>
</div>
