<div class="container-fluid">

    <div class="d-flex flex-row m-2 mt-4">
        <div class="flex-column me-auto">
            <h2 class="h2">Your Orders</h2>
        </div>
        <div class="flex-column">
            <app-profile-order-search-bar-component></app-profile-order-search-bar-component>
        </div>
        <div class="flex-column">
            <app-profile-order-select-component></app-profile-order-select-component>
        </div>
    </div>

    <table class="table table-hover">
        <thead>
            <tr>
                <th>#</th>
                <th>Count</th>
                <th>Products Count</th>
                <th>Date</th>
                <th>Sum</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>  
            <div class="accordion" id="accordion">
                @for(order of orderList; track $index){
                    <app-order-accordion-template-component [order]="order"></app-order-accordion-template-component>
                }
            </div>
        </tbody>
    </table>


</div>
